steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      submodules: true

  - name: Setup Ruby
    uses: ruby/setup-ruby@v1
    with:
      ruby-version: '3.1'

  - name: Install dependencies
    run: |
      gem install bundler
      bundle install

  - name: Build site
    run: bundle exec jekyll build

  - name: Deploy to GitHub Pages
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ./_site
